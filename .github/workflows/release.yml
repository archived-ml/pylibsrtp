name: release

on:
  push:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install OS packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libsrtp2-dev

      - name: Build source distribution
        run: |
          python -m pip install -U pip build
          python -m build --sdist

      - name: Build abi3 wheel
        env:
          CIBW_BUILD: cp310-manylinux_x86_64
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_BUILD: python scripts/build-libsrtp.py /tmp/vendor
          CIBW_ENVIRONMENT: CFLAGS=-I/tmp/vendor/include LDFLAGS=-L/tmp/vendor/lib PKG_CONFIG_PATH=/tmp/vendor/lib/pkgconfig
          CIBW_TEST_COMMAND: python -m unittest discover -s {project}/tests
        run: |
          python -m pip install -U cibuildwheel
          cibuildwheel --output-dir dist

      - name: Build cp314t wheel
        env:
          CIBW_BUILD: cp314t-manylinux_x86_64
          CIBW_ARCHS_LINUX: x86_64
          CIBW_BEFORE_BUILD: python scripts/build-libsrtp.py /tmp/vendor
          CIBW_ENVIRONMENT: CFLAGS=-I/tmp/vendor/include LDFLAGS=-L/tmp/vendor/lib PKG_CONFIG_PATH=/tmp/vendor/lib/pkgconfig
          CIBW_TEST_COMMAND: python -m unittest discover -s {project}/tests
        run: |
          python -m pip install -U cibuildwheel
          cibuildwheel --output-dir dist

      - name: Set release tag
        id: release_tag
        run: echo "tag=push-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.tar.gz
            dist/*cp310-abi3*.whl
            dist/*cp314t*.whl
